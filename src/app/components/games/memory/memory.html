<app-games [title]="themeService.isRetro() ? '[ MEMORY.EXE ]' : i18nService.t('memory.title')">
  <div class="memory-wrap">

    <div class="hud">
      <span class="score-tag" aria-live="polite">
        {{ i18nService.t('memory.pairs') }}: {{ matchCount() }}/{{ TOTAL_PAIRS }}
      </span>
      <button class="gbtn" (click)="newGame()" [attr.aria-label]="i18nService.t('memory.new')">
        {{ i18nService.t('memory.new') }}
      </button>
    </div>

    <div
      class="card-grid"
      role="grid"
      aria-label="Memory card matching grid"
    >
      @for (card of cards(); track card.id) {
        <div
          class="mem-card"
          [class.flipped]="card.flipped || card.matched"
          [class.matched]="card.matched"
          role="gridcell"
          tabindex="0"
          [attr.aria-label]="card.flipped || card.matched ? card.emoji : 'Hidden card ' + (card.id + 1)"
          [attr.aria-pressed]="card.flipped"
          (click)="flip(card.id)"
          (keydown.enter)="flip(card.id)"
          (keydown.space)="flip(card.id); $event.preventDefault()"
        >
          <span class="card-face" aria-hidden="true">
            {{ card.flipped || card.matched ? card.emoji : '' }}
          </span>
        </div>
      }
    </div>

    @if (won()) {
      <div class="win-msg" role="alert" aria-live="assertive">
        {{ i18nService.t('memory.win') }}
      </div>
    }

    <p class="hint-text">{{ i18nService.t('memory.hint') }}</p>

  </div>
</app-games>
