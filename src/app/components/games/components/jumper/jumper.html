<app-games [title]="themeService.isRetro() ? '[ JUMPER.EXE ]' : i18nService.t('jumper.title')">
  <div class="jumper-wrap">

    <div class="hud">
      <span class="score-tag" aria-live="polite">
        {{ i18nService.t('jumper.score') }}: {{ score() }}
      </span>
      <span class="hint-inline">{{ i18nService.t('jumper.jump') }}</span>
    </div>

    <canvas
      #canvas
      [width]="W"
      [height]="H"
      class="jumper-canvas"
      tabindex="0"
      role="img"
      [attr.aria-label]="i18nService.t('jumper.hint')"
      (click)="onTap()"
    ></canvas>

    <div class="controls">
      <button
        class="gbtn"
        (click)="startGame()"
        [attr.aria-label]="running() ? i18nService.t('jumper.restart') : i18nService.t('jumper.start')"
      >
        {{ running() ? i18nService.t('jumper.restart') : i18nService.t('jumper.start') }}
      </button>
    </div>

    <p class="hint-text">{{ i18nService.t('jumper.hint') }}</p>

  </div>
</app-games>
