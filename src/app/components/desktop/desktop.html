<div class="desktop" [class.retro]="themeService.isRetro()" [class.modern]="themeService.isModern()">

  <!-- Animated wallpaper canvas -->
  <canvas #wallpaper class="wallpaper" aria-hidden="true"></canvas>

  <!-- Retro scanlines -->
  @if (themeService.isRetro()) {
    <div class="scanlines" aria-hidden="true"></div>
  }

  <!-- Desktop icon area — left column, Windows style -->
  <main class="icon-area" role="main" [attr.aria-label]="i18nService.t('desktop.hint')">
    <div class="icon-column" role="list" aria-label="Application shortcuts">
      @for (game of appData.games(); track game.id) {
        <div
          class="desktop-icon"
          role="listitem"
          tabindex="0"
          [attr.aria-label]="i18nService.t(game.nameKey) + ' — ' + i18nService.t('desktop.dblclick')"
          (dblclick)="launch(game)"
          (click)="selectIcon(game.id)"
          (click)="launch(game)"
          [class.selected]="selectedId() === game.id"
        >
          <div class="icon-img-wrap">
            <div
              class="icon-img"
              [style.background]="themeService.isRetro() ? game.bgRetro : game.bgModern"
            >
              <span class="icon-emoji" aria-hidden="true">{{ game.emoji }}</span>
              @if (themeService.isRetro()) {
                <div class="pixel-overlay" aria-hidden="true"></div>
              }
            </div>
          </div>
          <span class="icon-label">{{ i18nService.t(game.nameKey) }}</span>
        </div>
      }
    </div>
  </main>

  <!-- Taskbar -->
  <footer class="taskbar" role="toolbar" aria-label="Taskbar">

    <button class="start-btn" (click)="goBack()" [attr.aria-label]="i18nService.t('nav.back')">
      <span class="start-icon">⊞</span>
      @if (themeService.isRetro()) {
        <span class="start-text">{{ i18nService.t('taskbar.start') }}</span>
      }
    </button>

    <div class="taskbar-sep" aria-hidden="true"></div>

    <div class="taskbar-apps" role="list" aria-label="Open windows">
      @for (game of appData.games(); track game.id) {
        <button
          class="taskbar-app"
          role="listitem"
          [attr.aria-label]="i18nService.t(game.nameKey)"
          (click)="launch(game)"
        >
          <span class="taskbar-emoji" aria-hidden="true">{{ game.emoji }}</span>
          <span class="taskbar-label">{{ i18nService.t(game.nameKey) }}</span>
        </button>
      }
    </div>

    <div class="taskbar-right">
      <app-lang-toggle [compact]="true" />
      <div class="taskbar-sep" aria-hidden="true"></div>
      <div class="theme-pills" role="group" aria-label="Theme">
        <button class="pill" [class.active]="themeService.isRetro()" (click)="themeService.setTheme('retro')">{{ i18nService.t('theme.retro') }}</button>
        <button class="pill" [class.active]="themeService.isModern()" (click)="themeService.setTheme('modern')">{{ i18nService.t('theme.modern') }}</button>
      </div>
      <div class="taskbar-sep" aria-hidden="true"></div>
      <div class="clock-block" role="timer" [attr.aria-label]="'Time: ' + clock()">
        <span class="clock-time">{{ clock() }}</span>
        <span class="clock-date">{{ date() }}</span>
      </div>
    </div>

  </footer>

</div>
