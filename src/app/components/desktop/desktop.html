<div class="desktop" [class.retro]="themeService.isRetro()" [class.modern]="themeService.isModern()">

  <!-- ── Animated wallpaper canvas ── -->
  <canvas #wallpaper class="wallpaper" aria-hidden="true"></canvas>

  <!-- ── Retro scanlines ── -->
  @if (themeService.isRetro()) {
  <div class="scanlines" aria-hidden="true"></div>
  }

  <!-- ── Desktop icon area (left-aligned column, Windows style) ── -->
  <main class="icon-area" role="main" aria-label="Desktop">
    <div class="icon-column" role="list" aria-label="Application shortcuts">
      @for (game of games; track game.id) {
      <div class="desktop-icon" role="listitem" tabindex="0" [attr.aria-label]="game.name + ' — double-click to open'"
        (dblclick)="launch(game)" (click)="selectIcon(game.id)" (keydown.enter)="launch(game)"
        [class.selected]="selectedId() === game.id">
        <!-- Icon image -->
        <div class="icon-img-wrap">
          <div class="icon-img" [style.background]="themeService.isRetro() ? game.bgRetro : game.bgModern">
            <span class="icon-emoji" aria-hidden="true">{{ game.emoji }}</span>

            <!-- Retro pixel overlay -->
            @if (themeService.isRetro()) {
            <div class="pixel-overlay" aria-hidden="true"></div>
            }
          </div>
        </div>
        <!-- Icon label -->
        <span class="icon-label">{{ game.name }}</span>
      </div>
      }
    </div>
  </main>

  <!-- ── Taskbar (Windows-style bottom bar) ── -->
  <footer class="taskbar" role="toolbar" aria-label="Taskbar">

    <!-- Start button -->
    <button class="start-btn" (click)="goBack()" aria-label="Return to landing">
      @if (themeService.isRetro()) {
      <span class="start-icon">⊞</span>
      <span class="start-text" i18n="@@taskbar.start">START</span>
      } @else {
      <span class="start-icon modern-start">⊞</span>
      }
    </button>

    <!-- Divider -->
    <div class="taskbar-sep" aria-hidden="true"></div>

    <!-- Running apps strip -->
    <div class="taskbar-apps" role="list" aria-label="Open windows">
      @for (game of games; track game.id) {
      <button class="taskbar-app" role="listitem" [attr.aria-label]="'Open ' + game.name" (click)="launch(game)">
        <span class="taskbar-emoji" aria-hidden="true">{{ game.emoji }}</span>
        <span class="taskbar-label">{{ game.name }}</span>
      </button>
      }
    </div>

    <!-- Right side: clock + theme toggle -->
    <div class="taskbar-right">
      <div class="theme-pills" role="group" aria-label="Theme">
        <button class="pill" [class.active]="themeService.isRetro()" (click)="themeService.setTheme('retro')"
          aria-label="Retro theme">RETRO</button>
        <button class="pill" [class.active]="themeService.isModern()" (click)="themeService.setTheme('modern')"
          aria-label="Modern theme">Modern</button>
      </div>
      <div class="taskbar-sep" aria-hidden="true"></div>
      <div class="clock-block" role="timer" [attr.aria-label]="'Time: ' + clock()">
        <span class="clock-time">{{ clock() }}</span>
        <span class="clock-date">{{ date() }}</span>
      </div>
    </div>

  </footer>

</div>
